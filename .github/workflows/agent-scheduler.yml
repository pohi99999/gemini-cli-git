name: 'Agent on Schedule'

# Runs scheduled demands via cron
on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC daily
  workflow_dispatch:  # Allow manual trigger for testing
    inputs:
      demand:
        description: 'Demand to execute (e.g., marketing-scheduled)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-demands:
    runs-on: ubuntu-latest
    outputs:
      demands: ${{ steps.get_demands.outputs.demands }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Get scheduled demands'
        id: get_demands
        run: |
          # Check if user specified a demand
          if [ -n "${{ github.event.inputs.demand }}" ]; then
            DEMANDS='["${{ github.event.inputs.demand }}"]'
          else
            # Get all demand files from memory/demands/
            DEMANDS=$(ls memory/demands/*.md 2>/dev/null | xargs -n1 basename | sed 's/\.md$//' | jq -R -s -c 'split("\n")[:-1]')

            # If no demands found, use empty array
            if [ -z "$DEMANDS" ] || [ "$DEMANDS" = '[""]' ]; then
              DEMANDS='[]'
            fi
          fi

          echo "Scheduled demands: $DEMANDS"
          echo "demands=$DEMANDS" >> $GITHUB_OUTPUT

  run-scheduled-tasks:
    needs: detect-demands
    runs-on: ubuntu-latest
    strategy:
      matrix:
        demand: ${{ fromJson(needs.detect-demands.outputs.demands) }}
      fail-fast: false  # Continue other demands even if one fails
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Setup environment'
        id: setup
        run: |
          DEMAND="${{ matrix.demand }}"
          DEMAND_FILE="memory/demands/$DEMAND.md"

          # Bot identity defaults
          BOT_NAME="Agent Bot"
          BOT_EMAIL="agent-bot@users.noreply.github.com"

          echo "demand=$DEMAND" >> $GITHUB_OUTPUT
          echo "demand_file=$DEMAND_FILE" >> $GITHUB_OUTPUT
          echo "bot_name=$BOT_NAME" >> $GITHUB_OUTPUT
          echo "bot_email=$BOT_EMAIL" >> $GITHUB_OUTPUT

      - name: 'Setup Git'
        run: |
          git config user.name "${{ steps.setup.outputs.bot_name }}"
          git config user.email "${{ steps.setup.outputs.bot_email }}"

      - name: 'Prepare tmp directory'
        run: |
          mkdir -p tmp

      - name: 'Run autonomous agent'
        uses: ./.github/actions/run-gemini-cli-cached
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: 'gemini-3-pro-preview'
          prompt_file: ${{ steps.setup.outputs.demand_file }}
          gemini_debug: 'true'

      - name: 'Check for changes and create PR'
        env:
          GH_TOKEN: ${{ github.token }}
          DEMAND: ${{ steps.setup.outputs.demand }}
          DEMAND_FILE: ${{ steps.setup.outputs.demand_file }}
        run: |
          # Check if any files were created or modified
          if [ -z "$(git status --porcelain)" ]; then
            echo "ℹ️  No changes detected"
            echo "No PR will be created."
            exit 0
          fi

          # Changes detected! Prepare for PR
          echo "✅ Changes detected!"
          git status

          # Create a unique branch name using demand name
          BRANCH_NAME="$DEMAND-$(date +%Y%m%d-%s)"
          git checkout -b "$BRANCH_NAME"

          # Stage all changes (let the agent decide what to modify)
          git add -A

          # Count the files changed
          FILE_COUNT=$(git diff --staged --name-only | wc -l | tr -d ' ')

          # Commit
          git commit -m "Scheduled: $DEMAND

          🤖 Generated with Gemini CLI
          Co-Authored-By: Gemini <noreply@google.com>"

          # Push
          git push -u origin "$BRANCH_NAME"

          # Create PR
          gh pr create \
            --title "Scheduled: $DEMAND" \
            --body "## Scheduled Demand Execution

          **Demand**: \`$DEMAND\`
          **Files modified**: $FILE_COUNT

          This PR contains changes generated by executing the scheduled demand.

          **Review checklist**:
          - [ ] Changes are accurate and high quality
          - [ ] No sensitive information included
          - [ ] Links and references are correct

          ---
          🤖 Generated with [Gemini CLI](https://github.com/google-gemini/gemini-cli)

          Co-Authored-By: Gemini <noreply@google.com>"

          echo "✅ PR created successfully!"

      - name: 'Handle errors'
        if: failure()
        env:
          DEMAND: ${{ steps.setup.outputs.demand }}
        run: |
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "❌ Scheduled demand execution failed: $DEMAND"
          echo ""
          echo "Common causes:"
          echo "1. Invalid GEMINI_API_KEY - Verify secret is set correctly"
          echo "2. Rate limits - Check quota at https://aistudio.google.com/"
          echo "3. Invalid demand file - Check YAML frontmatter syntax"
          echo "4. Missing skill - Ensure skill referenced in demand exists"
          echo "5. Permissions - Verify workflow has write permissions"
          echo ""
          echo "Next steps:"
          echo "- Review workflow logs above for specific error details"
          echo "- Check demand file: memory/demands/$DEMAND.md"
          echo "- Verify skill exists: memory/skills/[skill-name]/"
          echo "- Test manually: gh workflow run agent-scheduler.yml -f demand=$DEMAND"
          echo ""
          echo "View logs: $WORKFLOW_URL"
